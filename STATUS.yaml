  - id: PRISMA_ENGINE_UNREPLACEABLE_ON_VPS
    status: NEEDS_OWNER
    note: >-
      Login pelanggan bergantung pada SATU file untracked di VPS yang tidak ada yang bisa membuat
      ulang. Rantai terverifikasi 2026-09-02: (1) deploy.yml TIDAK punya prisma generate —
      satu-satunya kata "prisma" di sana adalah komentar; ci.yml:55 justru punya, dengan
      DATABASE_URL dummy. (2) Klaim .gitignore:44-47 "npm ci runs postinstall which regenerates the
      right engine" TERFALSIFIKASI lokal: src/generated/prisma/ di mesin dev tidak punya engine
      native sama sekali setelah beberapa npm ci hari ini, hanya query_engine_bg.wasm. (3) Engine
      linux .so.node TIDAK di-gitignore dan 0 ter-track. (4) deploy.yml:38 hanya git reset --hard
      origin/live, tanpa -fdx dan tanpa git clean — jadi file untracked SELAMAT tiap deploy.
      Kesimpulan: sign-in hidup karena engine linux yang pernah dibuat entah kapan masih menempel di
      /var/www/jvto-web. Kalau file itu hilang, npm ci tidak membuatnya lagi, build tetap 106/106
      lulus, health check deploy.yml:59-63 tetap lulus karena hanya cek homepage 200, dan login mati
      DIAM-DIAM. Nol halaman menyentuh Prisma (schema dipangkas 103->6 model, sisanya NextAuth + 1
      validator), jadi tidak ada gerbang yang bisa menangkapnya. PERBAIKAN: tambah "npx prisma
      generate" sebelum npm run build di deploy.yml + asersi ls src/generated/prisma/*.so.node.
      Butuh pemilik karena guardrail melarang perubahan workflow deploy.
  - id: INDEXNOW_ENDPOINT_UNAUTHENTICATED
    status: TODO
    note: >-
      POST /api/indexnow (src/app/(api)/api/indexnow/route.ts:42-60) tanpa auth, tanpa rate limit,
      tanpa cek origin. middleware matcher mengecualikan /api, jadi tidak ada penjaga di hulu.
      Terbuka karena deploy.yml:90-93 memanggilnya anonim dari GitHub Actions. Mitigasi yang sudah
      ada: indexnow.ts:18 memfilter URL ke BASE_URL, jadi penyerang tidak bisa menyuntik URL asing,
      dan INDEXNOW_KEY memang publik by design (public/f6d885656876420a925cbbd9b27a2139.txt). Risiko
      sisa: loop-abuse — build sitemap penuh berulang di VPS + submit berulang yang bisa membuat key
      di-throttle Bing. Perbaikan tanpa menyentuh workflow: rate limit atau shared-secret header;
      kalau pakai header, deploy.yml ikut berubah dan itu jadi gerbang pemilik.
