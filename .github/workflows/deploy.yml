name: Deploy to VPS

on:
  push:
    branches:
      - live
  workflow_dispatch:

# One deploy at a time. Every run does `git reset --hard` and `npm ci` in the
# same /var/www/jvto-web, so two overlapping runs fight over one node_modules:
# on 2026-08-26 a push and a dispatched deploy landed a minute apart and both
# died with `ENOTEMPTY: directory not empty, rmdir .../@prisma/client/runtime`,
# leaving pm2 serving the previous build. Queue instead of cancel — a cancelled
# run has already reset the checkout and may have started building, so killing
# it is how you get a half-deployed tree.
concurrency:
  group: jvto-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy jvto-web (production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20
            cd /var/www/jvto-web
            git fetch origin
            git checkout live
            git reset --hard origin/live
            ECOSYSTEM_REVALIDATE_SECRET='${{ secrets.ECOSYSTEM_REVALIDATE_SECRET }}'
            if [ -n "$ECOSYSTEM_REVALIDATE_SECRET" ]; then
              touch .env
              if grep -q '^ECOSYSTEM_REVALIDATE_SECRET=' .env; then
                sed -i "s|^ECOSYSTEM_REVALIDATE_SECRET=.*|ECOSYSTEM_REVALIDATE_SECRET=$ECOSYSTEM_REVALIDATE_SECRET|" .env
              else
                printf '\nECOSYSTEM_REVALIDATE_SECRET=%s\n' "$ECOSYSTEM_REVALIDATE_SECRET" >> .env
              fi
            fi
            # npm ci removes node_modules itself, but cannot recover a tree a
            # previous concurrent run left mid-delete — that is the ENOTEMPTY
            # above, and it persists until the directory is cleared by hand.
            # Clearing it here makes a broken server self-healing on the next
            # deploy rather than needing someone to SSH in.
            rm -rf node_modules
            npm ci
            # The Prisma query engine is host-specific and has never been in git
            # (`git ls-files` shows no *.so.node, ever). Until 2026-09-02 nothing
            # in this script generated one either: the .gitignore comment claimed
            # `npm ci` covers it via @prisma/client's postinstall, but that
            # postinstall swallows a failed generate — it catches the error and
            # exits 0 — and on a dev machine it demonstrably produces no engine
            # at all. The only reason sign-in kept working is that `git reset
            # --hard` above has no -fdx, so an engine generated by hand long ago
            # survived every deploy as an untracked file. One `rm` away from
            # silent breakage.
            #
            # It fails silently because nothing downstream touches Prisma: the
            # schema is 6 models, all of them NextAuth's, so all 106 pages
            # prerender fine and the health check below only asks the homepage
            # for a 200. A missing engine takes out customer sign-in and nothing
            # else — no build error, no failing check.
            #
            # generate never connects; the fallback URL only satisfies
            # env("DATABASE_URL") in prisma.config.ts when the shell has none.
            # Same pattern as ci.yml.
            DATABASE_URL="${DATABASE_URL:-postgresql://user:pass@localhost:5432/db}" \
              npx --no-install prisma generate
            if ! ls src/generated/prisma/*query_engine*.node >/dev/null 2>&1; then
              echo "FATAL: prisma generate produced no native query engine." >&2
              echo "Customer sign-in would be dead on this deploy. Refusing to continue." >&2
              exit 1
            fi
            npm run build
            npm run audit:ecosystem-visible-content
            pm2 restart jvto-web
            echo "Waiting for the app to come back up before validating JSON-LD..."
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "https://javavolcano-touroperator.com/")
              [ "$code" = "200" ] && break
              sleep 3
            done
            npm run validate:jsonld-schema
            # 217 review permalinks are public, indexed URLs whose numeric ids are
            # baked into their JSON-LD @ids. This validator existed but no workflow
            # ran it, so a break in those pages would only have surfaced by chance.
            npm run validate:review-pages
      - name: Ping IndexNow (best-effort, non-blocking)
        continue-on-error: true
        run: |
          echo "Waiting for the app to come back up (checking every 3s, up to 60s)..."
          up=false
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "https://javavolcano-touroperator.com/")
            if [ "$code" = "200" ]; then
              echo "App is up after $((i * 3))s (HTTP $code)."
              up=true
              break
            fi
            sleep 3
          done

          if [ "$up" != "true" ]; then
            echo "### :warning: IndexNow ping skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "App did not return HTTP 200 within 60s after deploy -- IndexNow was NOT notified. Submit manually once the app is confirmed up: \`curl -X POST https://javavolcano-touroperator.com/api/indexnow -H 'Content-Type: application/json' -d '{\"scope\":\"sitemap\"}'\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          response=$(curl -sS -X POST "https://javavolcano-touroperator.com/api/indexnow" \
            -H "Content-Type: application/json" \
            -d '{"scope":"sitemap"}' \
            --max-time 30)
          echo "$response"

          if ! echo "$response" | grep -q '"ok":true'; then
            echo "### :warning: IndexNow ping failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Response: \`$response\`" >> "$GITHUB_STEP_SUMMARY"
          fi
