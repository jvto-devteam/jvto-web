name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allow manual re-run of the help/develop deploy on demand

# Serialize deploys. Without this, near-simultaneous pushes run concurrent SSH
# jobs mutating the same /var/www/jvto-help checkout + .next (documented race
# hazard), and the SHA verification below could compare against another run's
# deploy. Queued, never cancelled: every push still deploys, in order.
concurrency:
  group: deploy-help-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy jvto-help
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Fail-fast + pipefail from the very top. nounset (-u) is enabled only
            # AFTER sourcing nvm: nvm.sh references unset vars (MANPATH/PREFIX/...)
            # while loading, so `set -u` before it would abort every deploy.
            set -eo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            # Resolve pm2 in the pre-switch env (where it has always been
            # reachable — the deploy worked here before Next 16). If pm2 is a
            # global under the box's default Node 18, `nvm use 20` below would
            # drop it from PATH and `pm2 restart` would be command-not-found,
            # leaving the site frozen despite a green build. Call it by this
            # captured path at the end instead.
            PM2_BIN="$(command -v pm2 || echo pm2)"
            # Next.js 16 requires Node >=20.9.0. nvm is sourced above but its
            # default on this box is 18, so `next build` aborted every deploy.
            # Explicitly select 20 here (installed on the box) for the build.
            nvm use 20
            set -u
            # The commit this run deploys. Exported BEFORE the build and kept in
            # the shell for the pm2 --update-env restart, so the running server
            # reports it at /api/build-info and the verify step below can prove
            # the box is actually serving this commit.
            export APP_COMMIT_SHA="${{ github.sha }}"
            cd /var/www/jvto-help
            # Force the working tree to exactly the triggering commit. A plain
            # `git pull` does not fast-forward a dirty/diverged VPS tree, and
            # resetting to a moving origin/main could deploy a NEWER commit than
            # the one this run stamps into APP_COMMIT_SHA — the SHA gate needs
            # code and stamp to always match. The commit is on main, so the
            # branch fetch below contains it.
            # `reset --hard` only touches tracked files -> untracked env files
            # (.env.local with CMS_ADMIN_EMAILS, DB creds) are left intact.
            # Do NOT add `git clean` here (it would delete those env files).
            git fetch --prune origin main
            git reset --hard "$APP_COMMIT_SHA"
            npm ci
            npm run build
            # --update-env so pm2 picks up newly-added env (APP_COMMIT_SHA above,
            # CMS_ADMIN_EMAILS, ...). $PM2_BIN (captured pre-`nvm use 20`) so
            # switching Node for the build can't hide a Node-18-global pm2 from
            # PATH -> command-not-found.
            "$PM2_BIN" restart jvto-help --update-env

      # ── Post-deploy proof ─────────────────────────────────────────────────
      # The SSH step exiting 0 only proves the script ran; these steps prove the
      # box is serving THIS commit and the migrated routes actually respond.

      - name: Verify deployed commit SHA
        run: |
          set -euo pipefail
          EXPECTED="${{ github.sha }}"
          URL="https://help.javavolcano-touroperator.com/api/build-info"
          for i in $(seq 1 12); do
            ACTUAL="$(curl -fsS --max-time 15 "$URL" | jq -r '.commitSha' 2>/dev/null || echo "")"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "Deployed SHA verified: $ACTUAL"
              exit 0
            fi
            echo "attempt $i/12: build-info reports '${ACTUAL:-<unreachable>}', expected '$EXPECTED' — retrying in 10s"
            sleep 10
          done
          echo "::error::/api/build-info never reported ${EXPECTED} — deployment NOT verified"
          exit 1

      - name: Smoke-test Why JVTO routes
        run: |
          set -euo pipefail
          BASE="https://help.javavolcano-touroperator.com"
          FAIL=0
          for r in /why-jvto /why-jvto/our-story /why-jvto/the-jvto-difference /why-jvto/our-team /why-jvto/community-standards /why-jvto/reviews; do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$r")"
            if [ "$CODE" = "200" ]; then
              echo "200 OK  $r"
            else
              echo "::error::HTTP $CODE on $r"
              FAIL=1
            fi
          done
          exit $FAIL
