name: Deploy to VPS

on:
  push:
    branches:
      - live
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy jvto-web (production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20
            cd /var/www/jvto-web
            git fetch origin
            git checkout live
            git reset --hard origin/live
            ECOSYSTEM_REVALIDATE_SECRET='${{ secrets.ECOSYSTEM_REVALIDATE_SECRET }}'
            if [ -n "$ECOSYSTEM_REVALIDATE_SECRET" ]; then
              touch .env
              if grep -q '^ECOSYSTEM_REVALIDATE_SECRET=' .env; then
                sed -i "s|^ECOSYSTEM_REVALIDATE_SECRET=.*|ECOSYSTEM_REVALIDATE_SECRET=$ECOSYSTEM_REVALIDATE_SECRET|" .env
              else
                printf '\nECOSYSTEM_REVALIDATE_SECRET=%s\n' "$ECOSYSTEM_REVALIDATE_SECRET" >> .env
              fi
            fi
            npm ci
            npm run build
            npm run audit:ecosystem-visible-content
            pm2 restart jvto-web
      - name: Ping IndexNow (best-effort, non-blocking)
        continue-on-error: true
        run: |
          echo "Waiting for the app to come back up (checking every 3s, up to 60s)..."
          up=false
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "https://javavolcano-touroperator.com/")
            if [ "$code" = "200" ]; then
              echo "App is up after $((i * 3))s (HTTP $code)."
              up=true
              break
            fi
            sleep 3
          done

          if [ "$up" != "true" ]; then
            echo "### :warning: IndexNow ping skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "App did not return HTTP 200 within 60s after deploy -- IndexNow was NOT notified. Submit manually once the app is confirmed up: \`curl -X POST https://javavolcano-touroperator.com/api/indexnow -H 'Content-Type: application/json' -d '{\"scope\":\"sitemap\"}'\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          response=$(curl -sS -X POST "https://javavolcano-touroperator.com/api/indexnow" \
            -H "Content-Type: application/json" \
            -d '{"scope":"sitemap"}' \
            --max-time 30)
          echo "$response"

          if ! echo "$response" | grep -q '"ok":true'; then
            echo "### :warning: IndexNow ping failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Response: \`$response\`" >> "$GITHUB_STEP_SUMMARY"
          fi
