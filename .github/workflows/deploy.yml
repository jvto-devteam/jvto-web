name: Deploy to VPS

# Help/preview deploy runs on a DEDICATED SELF-HOSTED RUNNER on the VPS
# (label `jvto-help-deploy`), replacing the former inbound GitHub -> VPS SSH
# action. There is NO SSH connection from GitHub to the box and no inbound
# host/user/key deploy secrets at all: the runner pulls the job locally and
# invokes a single, fixed, root-owned, sudoers-restricted deploy script. The
# runner process itself runs as the unprivileged `jvto-deploy` user and escalates
# ONLY to run `/usr/local/sbin/deploy-jvto-help <sha>` via a narrow sudoers rule.
# /api/build-info + scripts/smoke-why-jvto.mjs remain the deployment proof.
#
# Only this workflow requests the `jvto-help-deploy` label, and it triggers only
# on push-to-main + workflow_dispatch — never on pull_request. So PR CI (verify /
# outbox-db / build, all `ubuntu-latest`) never runs on the self-hosted
# runner.

on:
  push:
    branches:
      - main
    # True-documentation-only pushes do not change what the help box serves, so
    # they must not trigger a deploy (automation-governance hardening
    # 2026-08-04). "Documentation" here is ONLY root-level Markdown
    # (README.md / CLAUDE.md — `*.md` matches the repo root, not nested paths)
    # and `docs/**`. Served content Markdown is production output and MUST still
    # deploy — `content/pages/**/*.md` renders via loadStaticPage and
    # `src/data/blog/**/*.md` via src/lib/blog.ts — so a blanket `**/*.md` would
    # wrongly skip a real content deploy. A push that also touches any non-doc
    # file still deploys; workflow_dispatch stays available for a manual re-run.
    # (The docs-only rule + its self-test live in scripts/ci/docs-only-selftest.sh.)
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:   # allow manual re-run of the help/develop deploy on demand
    inputs:
      deploy_sha:
        description: >-
          Optional 40-char lowercase hex commit SHA to deploy. Must equal the
          current origin/main tip (the VPS script fail-closes otherwise).
          Defaults to the triggering commit when omitted.
        required: false
        type: string

# Serialize deploys. Without this, near-simultaneous pushes run concurrent jobs
# mutating the same /var/www/jvto-help checkout + .next (documented race hazard),
# and the SHA verification below could compare against another run's deploy.
# `cancel-in-progress: false` keeps the in-flight deploy from being cancelled, so
# at most ONE deploy runs at a time. This only SERIALIZES deploys — it does NOT
# guarantee FIFO or that every push deploys: GitHub holds at most one running +
# one pending run per group, and a newer push REPLACES the older PENDING run
# (pending-run coalescing). So a mid-burst commit can be superseded before it
# ever deploys; the newest queued push is what ultimately lands. Confirm the
# deployed commit via /api/build-info. (The VPS script also fail-closes if its
# target SHA is no longer origin/main, so a superseded deploy never rolls back.)
concurrency:
  group: deploy-help-main
  cancel-in-progress: false

# Least privilege: the deploy runs locally on the VPS via a sudoers-restricted
# script; the only GitHub API this workflow needs is repo read for the
# post-deploy checkout of the smoke script.
permissions:
  contents: read

jobs:
  deploy:
    # Dedicated VPS runner. Only this job requests `jvto-help-deploy`.
    runs-on: [self-hosted, Linux, X64, jvto-help-deploy]
    timeout-minutes: 40
    steps:
      - name: Resolve + validate target SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ github.event.inputs.deploy_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # push -> the triggering commit; workflow_dispatch with deploy_sha ->
          # that SHA (else the dispatch ref's head). Validate 40-char lowercase
          # hex here so a bad input fails fast BEFORE any deploy; the VPS script
          # re-validates and additionally requires it to be origin/main.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_SHA:-}" ]; then
            TARGET="$INPUT_SHA"
          else
            TARGET="$PUSH_SHA"
          fi
          if ! printf '%s' "$TARGET" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Target SHA '$TARGET' is not a 40-char lowercase hex commit SHA."
            exit 1
          fi
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Target deploy SHA: $TARGET"

      - name: Deploy jvto-help (local runner, sudoers-restricted script)
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          # The ONLY privileged call. The runner user (jvto-deploy) may run just
          # this one root command via /etc/sudoers.d/jvto-deploy-help; the script
          # takes exactly one SHA (no free command/path) and fail-closes unless
          # it is the current origin/main tip.
          sudo /usr/local/sbin/deploy-jvto-help "$TARGET_SHA"

      # ── Post-deploy proof (same VPS runner) ───────────────────────────────
      # The deploy step exiting 0 only proves the script ran; these steps prove
      # the box is serving THIS commit and the migrated routes actually respond.

      - name: Checkout (for the smoke script)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify deployment + Why JVTO live smoke
        # scripts/smoke-why-jvto.mjs (zero deps, built-in fetch): waits for
        # /api/build-info to report the target SHA, then asserts all six why-jvto
        # routes return 200 with the production canonical + exactly one FAQPage
        # node, and that the hub shows 11 active crew / 7 guides / 4 drivers and
        # none of "14 … crew", "guidebook 2016", "ISIC Partner", or an INDECON
        # validation/partnership claim. EXPECTED_SHA is the SAME target SHA the
        # deploy used.
        env:
          BASE_URL: https://help.javavolcano-touroperator.com
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/smoke-why-jvto.mjs
