name: CI

# Pre-merge checks for the `live` (production) branch. The meaningful invariant
# for the automated llm-wiki sync is the DRIFT gate: the committed bundles under
# src/data/ must match the producer's compiled output. lint/typecheck are
# non-blocking (live carries pre-existing debt; artifact-only sync PRs must not
# be gated on it). No build job here — production deploy is owned separately.
on:
  pull_request:
    branches: [live]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jvto-web (live)
        uses: actions/checkout@v4

      # Producer repo, so the drift check can re-sync and compare.
      #
      # No `token:` here on purpose. sambuko82/llm-wiki is public, so the
      # default checkout credentials reach it. This step used to pass
      # secrets.GH_PAT; that secret no longer authenticates, and handing
      # actions/checkout an unusable token makes it attempt auth and fail with
      # "could not read Username" rather than falling back to anonymous access.
      # Every CI run from at least 2026-08-19 died here, before reaching any
      # check this workflow exists to run.
      - name: Checkout llm-wiki (producer)
        uses: actions/checkout@v4
        with:
          repository: sambuko82/llm-wiki
          ref: master
          path: llm-wiki

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate schema & routes (blocking)
        # Zero-dep static gates (scripts/validate.mjs): fails on duplicate
        # Organization/BreadcrumbList/FAQPage per route and registry/route drift.
        run: |
          npm run validate schema
          npm run validate routes

      - name: Generate Prisma client
        # generate does not connect; the dummy URL only satisfies env("DATABASE_URL").
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
        run: npx prisma generate

      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint

      # sync:trust and src/data/trust-bundle were removed on 2026-08-15 in
      # 1542fb08 — trust content flows through ekosistem now — but this step
      # kept calling them, so every run since has failed on a missing script.
      # The last green run of this workflow was 2026-08-11.
      - name: Sync bundles and check for drift
        env:
          LLM_WIKI_PATH: ${{ github.workspace }}/llm-wiki
        run: |
          npm run sync:packages
          npm run sync:blog
          git diff --exit-code src/data/package-readiness src/data/blog \
            || { echo "::error::Synced bundles drifted from llm-wiki output. Run 'npm run sync:packages && npm run sync:blog' and commit."; exit 1; }

      - name: Validate package-readiness artifacts (offline)
        run: npm run validate:packages -- --offline

      - name: Typecheck (non-blocking)
        continue-on-error: true
        run: npx tsc --noEmit
