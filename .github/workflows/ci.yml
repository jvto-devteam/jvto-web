name: CI

# Pre-merge checks. Production deploy stays owned by deploy.yml (push -> main).
# The `verify` job runs lint/typecheck/drift on a GitHub runner (no build: SSG
# build needs Postgres). The `build-develop` job runs a real `npm run build` on
# the DEVELOP server (dev DB) over SSH — verification only, never production.
# `live` is included so promote PRs (live <- main) pass the same verify gate
# before production picks them up — see docs/CONTRIBUTING.md (branch model).
on:
  pull_request:
    branches: [main, live]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jvto-web
        uses: actions/checkout@v4

      # Producer repo, so the drift check can re-sync and compare. Reuses GH_PAT
      # (same secret used by update-volcanic-status.yml).
      - name: Checkout llm-wiki (producer)
        uses: actions/checkout@v4
        with:
          repository: sambuko82/llm-wiki
          ref: master
          path: llm-wiki
          token: ${{ secrets.GH_PAT }}

      # Second producer repo, for src/data/okf/ (see scripts/sync-okf.mjs). Prior
      # to this, src/data/okf/ was a one-shot hand snapshot with no sync path and
      # no CI gate — it silently drifted from OKF's canonical wording.
      - name: Checkout knowledge-catalog-jvto-bootstrap (producer)
        uses: actions/checkout@v4
        with:
          repository: sambuko82/knowledge-catalog-jvto-bootstrap
          ref: main
          path: knowledge-catalog-jvto-bootstrap
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate schema & routes (blocking)
        # Zero-dep static gates (scripts/validate.mjs): fails on duplicate
        # Organization/BreadcrumbList/FAQPage per route and registry/route drift.
        # Direct node invocations: `npm run validate` is now a chained gate
        # (schema && routes && content), so npm arg-append no longer selects a
        # subcommand.
        run: |
          node scripts/validate.mjs schema
          node scripts/validate.mjs routes

      - name: Validate content drift (blocking)
        # Canonical-facts gate (scripts/validate-content-drift.mjs): scans src/,
        # public/llms*.txt and docs/CANONICAL_FACTS.md for forbidden patterns —
        # stale founding year, blue-fire "guarantee" wording, stale review
        # counts, non-IDR prices, stale deposit/group terms, unverified press
        # names, and the retired jvto-config.json brand-config JSON pattern.
        # Lines carrying a `drift-ok: <reason>` marker are whitelisted (used by
        # docs/CANONICAL_FACTS.md to quote forbidden examples deliberately).
        run: npm run validate:content

      - name: Validate static content + migrated-route ownership (blocking)
        # content:check = static-content structure (Zod + fixtures) + internal
        # links + the migrated-route ownership gate
        # (scripts/validate-static-route-ownership.mjs): a route migrated to
        # content/pages/** that reverts to ANY legacy source — pageSnapshots,
        # CMS seed, content_pages, the FAQ resolver, or a DB narrative-claims
        # read — fails the build, and forbidden claims (14 crew, ISIC Partner,
        # INDECON-as-partnership) are rejected. Previously this only ran via
        # prebuild on the non-required build-develop job; it is required now.
        run: npm run content:check

      - name: Docs-only classifier self-test (blocking)
        # Asserts the true-documentation-only classifier verdict for the full
        # case matrix AND that ci.yml/deploy.yml still carry the exact predicate
        # / paths-ignore — so a future edit that widens "docs" (e.g. back to a
        # blanket **/*.md that sweeps in served content Markdown) fails here.
        run: bash scripts/ci/docs-only-selftest.sh

      - name: Deploy script self-test (blocking)
        # Asserts scripts/ops/deploy-jvto-help.sh invariants so they can't regress:
        # pm2 is resolved BEFORE `nvm use 20` (default-Node global drop bug), PM2_BIN
        # is absolute+executable, the SHA is 40-hex and must equal origin/main
        # (fail-closed), flock serialization, no `git clean`, build-before-restart,
        # $PM2_BIN --update-env restart, and no `pm2 update`.
        run: npm run test:deploy-script

      - name: Workflow security self-test (blocking)
        # Proves the PR + help-deploy workflows carry NO inbound SSH: no
        # appleboy/ssh-action, no DEVELOP_SSH_*/VPS_* secrets; the help deploy runs
        # only on the jvto-help-deploy local runner; and ci.yml has a `build` job
        # running npm ci + npm run build (the GitHub-hosted production build gate).
        run: npm run test:workflow-security

      - name: Milestone 0 baseline gates (blocking)
        # (1) Canonical checkout Ijen-notice self-test — mandatory wording present,
        # Ijen-only targeting, retired wording absent. (2) Authority/consumer
        # manifest drift — regenerate and fail if it differs from the committed
        # copy (deterministic; keeps the baseline honest). The freeze gate itself
        # runs inside content:check (validate-static-route-ownership check #7).
        run: |
          npm run test:ijen-notice
          npm run test:manifest
          npm run baseline:manifest
          git diff --exit-code docs/architecture/authority-consumer-manifest.json docs/architecture/authority-consumer-manifest.md \
            || { echo "::error::authority/consumer manifest drifted — run 'npm run baseline:manifest' and commit."; exit 1; }

      - name: Milestone 1 architecture gates (blocking)
        # (1) Architecture dependency gate — blocks forbidden cross-domain / cross-layer
        # imports in the new modular tree (src/domains, src/application, src/infrastructure).
        # (2) Outbox self-test (in-memory adapter) — atomic unit-of-work, at-least-once
        # delivery with an idempotent consumer, dedup, retry→dead-letter, deferred/
        # anti-starvation, flag-off no-op (handoff §7.7). The DURABLE Prisma-backed store
        # (src/infrastructure/outbox/prisma-outbox.ts) + its additive domain_outbox table
        # (prisma/schema.prisma + sql/2026-08-05_domain_outbox.sql) ship in this PR but the
        # worker stays disabled at runtime; the two-way-rollback / lease-fencing /
        # concurrency / dead-letter proof runs against a REAL Postgres in the separate
        # blocking `outbox-db` job (service container). The physical table is applied to
        # develop/production by an owner-gated migration, never by CI.
        run: |
          npm run validate:architecture
          npm run test:outbox

      - name: Milestone 2 public knowledge gates (blocking)
        # (1) Compiler self-test (determinism + referential integrity + digest).
        # (2) Manifest drift — regenerate public-knowledge.json from content/ and fail on
        #     any non-empty git diff (deterministic; same pattern as the M0 authority
        #     manifest). (3) Consumer gate — every compiled route is consistent across the
        #     sitemap + the /api/knowledge-feed route + content/entities. The physical
        #     content/ SSOT is the sole authority; the feed records the source commit at
        #     serve time (APP_COMMIT_SHA), so nothing DB is read for public knowledge.
        run: |
          npm run test:knowledge
          npm run knowledge:compile
          git diff --exit-code src/lib/publicContent/generated/public-knowledge.json \
            || { echo "::error::public-knowledge.json drifted from content/ — run 'npm run knowledge:compile' and commit."; exit 1; }
          npm run validate:knowledge
          # People trust-graph acceptance gates (record-level): crew count 11/7/4, no legacy
          # 14/7-driver, leadership+medical never inflate crew, per-guide KTA evidence,
          # KTA membership-not-govt-licence, review→existing-person, privacy allowlist,
          # supported relationships. (Render-parity gates land with the /team cutover.)
          npm run validate:people

      - name: Generate Prisma client
        # generate does not connect; the dummy URL only satisfies env("DATABASE_URL").
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
        run: npx prisma generate

      - name: Lint (blocking, baseline-gated)
        # Flat-config crash fixed 2026-07-05 (native eslint-config-next flat
        # exports; FlatCompat removed). Blocking via scripts/lint-gate.mjs:
        # any bucket in the committed per-file/per-rule baseline
        # (scripts/lint-baseline.json, 141 pre-existing errors) that grows =
        # fail — fixing legacy errors elsewhere cannot offset a new one.
        # Fixed legacy errors: `node scripts/lint-gate.mjs --update` + commit.
        run: npm run lint:gate

      - name: Sync bundles and check for drift
        env:
          LLM_WIKI_PATH: ${{ github.workspace }}/llm-wiki
          # sync-policy-bundle.mjs resolves its source via LLM_WIKI_ROOT (not
          # LLM_WIKI_PATH) per its own header comment — set both to the same
          # checked-out producer repo rather than editing the synced script.
          LLM_WIKI_ROOT: ${{ github.workspace }}/llm-wiki
          OKF_PATH: ${{ github.workspace }}/knowledge-catalog-jvto-bootstrap
        run: |
          npm run sync:packages
          npm run sync:trust
          npm run sync:blog
          npm run sync:policy-bundle
          npm run sync:okf
          git diff --exit-code src/data/package-readiness src/data/trust-bundle src/data/blog src/data/policy-bundle src/data/okf \
            || { echo "::error::Synced bundles drifted from source. Run 'npm run sync:packages && npm run sync:trust && npm run sync:blog && npm run sync:policy-bundle && npm run sync:okf' and commit."; exit 1; }

      - name: Validate OKF consumption (blocking)
        # scripts/validate-okf-consumption.mjs: every AGENT_GUIDES route (src/lib/
        # content/agentGuides.ts) must map to at least one OKF module, and its
        # copy must not diverge from OKF on any canonical-facts rule — catches
        # hand-edits away from the mandatory/canonical wording OKF ships.
        run: npm run validate:okf

      - name: Typecheck (non-blocking)
        continue-on-error: true
        run: npx tsc --noEmit

  # Real production-build gate — GitHub-hosted, NO SSH. Replaces the former
  # `build-develop` job that ran `npm run build` on the develop server over
  # appleboy/ssh-action (removed: it produced recurring flaky-SSH non-required
  # failures on every PR). `verify` deliberately skips the build because Next.js
  # SSG prerenders DB-backed pages, so the build needs Postgres — provided here
  # by a disposable `pgvector/pgvector:pg16` service container (the schema uses a
  # pgvector `vector` column + a pg_trgm GIN index). The schema is applied with
  # `prisma db push`; no seed data is needed — every DB-backed page prerenders
  # cleanly against an empty schema (verified: `npm run build` exits 0). This
  # proves `npm ci` + the real `npm run build` actually compile and prerender
  # before merge. It never uses an SSH secret and never touches develop/production.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: jvto_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build -d jvto_build"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Disposable service-container DB — never a project/develop/production DB.
      DATABASE_URL: postgresql://build:build@localhost:5432/jvto_build
      # Non-production origin (noindex) + a placeholder public token (the site is
      # not served in CI). APP_COMMIT_SHA only feeds /api/build-info at runtime.
      NEXT_PUBLIC_SITE_URL: https://help.javavolcano-touroperator.com
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci.placeholder.not-a-secret
      APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply schema to the disposable Postgres (pgvector + pg_trgm)
        # The schema declares a pgvector `vector` column and a pg_trgm GIN index,
        # so BOTH extensions must exist before `prisma db push` creates them.
        # Empty data is sufficient — the DB-backed pages prerender against it.
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || { echo "::error::psql missing on runner"; exit 1; }
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          npx prisma db push --skip-generate
          npx prisma generate
      - name: Production build (npm run build)
        # The real `next build` — compiles + prerenders every route (SSG pages
        # query the service-container DB). Any build failure blocks the PR.
        run: npm run build

  # Blocking proof of the DURABLE transactional outbox (handoff §7.7) against a REAL
  # Postgres — not the in-memory adapter, and not out-of-band. A disposable `postgres:16`
  # service container is created fresh per run; the additive migration is applied to it;
  # the Prisma client is generated; `npm run test:outbox:db` proves two-way transaction
  # rollback, lease fencing, dead-letter, and concurrent-claim disjointness. The job fails
  # (never skips) if the test is skipped or Postgres is unavailable. It runs as the normal
  # unprivileged runner user — no root, no runuser — and never touches develop/production.
  outbox-db:
    name: outbox-db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: outbox
          POSTGRES_PASSWORD: outbox
          POSTGRES_DB: outbox_itest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outbox -d outbox_itest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A throwaway service-container DB — distinct from any project/develop/production DB.
      DATABASE_URL: postgresql://outbox:outbox@localhost:5432/outbox_itest
      OUTBOX_ITEST_DATABASE_URL: postgresql://outbox:outbox@localhost:5432/outbox_itest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fail fast if the test would be skipped (Postgres must be reachable)
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || { echo "::error::psql missing on runner"; exit 1; }
          psql "$OUTBOX_ITEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT 1;' >/dev/null \
            || { echo "::error::Postgres service container unavailable — DB proof cannot be skipped."; exit 1; }
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Durable outbox DB integration test (blocking, real Postgres)
        # CI mode: run-outbox-db-itest.sh sees OUTBOX_ITEST_DATABASE_URL, applies the
        # additive migration to the service container, and runs the integration test.
        # No throwaway cluster, no root/runuser.
        run: npm run test:outbox:db
