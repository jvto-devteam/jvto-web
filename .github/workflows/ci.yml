name: CI

# Pre-merge checks. Production deploy stays owned by deploy.yml (push -> main).
# The `verify` job runs lint/typecheck/drift on a GitHub runner (no build: SSG
# build needs Postgres). The `build-develop` job runs a real `npm run build` on
# the DEVELOP server (dev DB) over SSH — verification only, never production.
# `live` is included so promote PRs (live <- main) pass the same verify gate
# before production picks them up — see docs/CONTRIBUTING.md (branch model).
on:
  pull_request:
    branches: [main, live]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jvto-web
        uses: actions/checkout@v4

      # Producer repo, so the drift check can re-sync and compare. Reuses GH_PAT
      # (same secret used by update-volcanic-status.yml).
      - name: Checkout llm-wiki (producer)
        uses: actions/checkout@v4
        with:
          repository: sambuko82/llm-wiki
          ref: master
          path: llm-wiki
          token: ${{ secrets.GH_PAT }}

      # Second producer repo, for src/data/okf/ (see scripts/sync-okf.mjs). Prior
      # to this, src/data/okf/ was a one-shot hand snapshot with no sync path and
      # no CI gate — it silently drifted from OKF's canonical wording.
      - name: Checkout knowledge-catalog-jvto-bootstrap (producer)
        uses: actions/checkout@v4
        with:
          repository: sambuko82/knowledge-catalog-jvto-bootstrap
          ref: main
          path: knowledge-catalog-jvto-bootstrap
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate schema & routes (blocking)
        # Zero-dep static gates (scripts/validate.mjs): fails on duplicate
        # Organization/BreadcrumbList/FAQPage per route and registry/route drift.
        # Direct node invocations: `npm run validate` is now a chained gate
        # (schema && routes && content), so npm arg-append no longer selects a
        # subcommand.
        run: |
          node scripts/validate.mjs schema
          node scripts/validate.mjs routes

      - name: Validate content drift (blocking)
        # Canonical-facts gate (scripts/validate-content-drift.mjs): scans src/,
        # public/llms*.txt and docs/CANONICAL_FACTS.md for forbidden patterns —
        # stale founding year, blue-fire "guarantee" wording, stale review
        # counts, non-IDR prices, stale deposit/group terms, unverified press
        # names, and the retired jvto-config.json brand-config JSON pattern.
        # Lines carrying a `drift-ok: <reason>` marker are whitelisted (used by
        # docs/CANONICAL_FACTS.md to quote forbidden examples deliberately).
        run: npm run validate:content

      - name: Validate static content + migrated-route ownership (blocking)
        # content:check = static-content structure (Zod + fixtures) + internal
        # links + the migrated-route ownership gate
        # (scripts/validate-static-route-ownership.mjs): a route migrated to
        # content/pages/** that reverts to ANY legacy source — pageSnapshots,
        # CMS seed, content_pages, the FAQ resolver, or a DB narrative-claims
        # read — fails the build, and forbidden claims (14 crew, ISIC Partner,
        # INDECON-as-partnership) are rejected. Previously this only ran via
        # prebuild on the non-required build-develop job; it is required now.
        run: npm run content:check

      - name: Docs-only classifier self-test (blocking)
        # Asserts the true-documentation-only classifier verdict for the full
        # case matrix AND that ci.yml/deploy.yml still carry the exact predicate
        # / paths-ignore — so a future edit that widens "docs" (e.g. back to a
        # blanket **/*.md that sweeps in served content Markdown) fails here.
        run: bash scripts/ci/docs-only-selftest.sh

      - name: Milestone 0 baseline gates (blocking)
        # (1) Canonical checkout Ijen-notice self-test — mandatory wording present,
        # Ijen-only targeting, retired wording absent. (2) Authority/consumer
        # manifest drift — regenerate and fail if it differs from the committed
        # copy (deterministic; keeps the baseline honest). The freeze gate itself
        # runs inside content:check (validate-static-route-ownership check #7).
        run: |
          npm run test:ijen-notice
          npm run baseline:manifest
          git diff --exit-code docs/architecture/authority-consumer-manifest.json docs/architecture/authority-consumer-manifest.md \
            || { echo "::error::authority/consumer manifest drifted — run 'npm run baseline:manifest' and commit."; exit 1; }

      - name: Generate Prisma client
        # generate does not connect; the dummy URL only satisfies env("DATABASE_URL").
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
        run: npx prisma generate

      - name: Lint (blocking, baseline-gated)
        # Flat-config crash fixed 2026-07-05 (native eslint-config-next flat
        # exports; FlatCompat removed). Blocking via scripts/lint-gate.mjs:
        # any bucket in the committed per-file/per-rule baseline
        # (scripts/lint-baseline.json, 141 pre-existing errors) that grows =
        # fail — fixing legacy errors elsewhere cannot offset a new one.
        # Fixed legacy errors: `node scripts/lint-gate.mjs --update` + commit.
        run: npm run lint:gate

      - name: Sync bundles and check for drift
        env:
          LLM_WIKI_PATH: ${{ github.workspace }}/llm-wiki
          # sync-policy-bundle.mjs resolves its source via LLM_WIKI_ROOT (not
          # LLM_WIKI_PATH) per its own header comment — set both to the same
          # checked-out producer repo rather than editing the synced script.
          LLM_WIKI_ROOT: ${{ github.workspace }}/llm-wiki
          OKF_PATH: ${{ github.workspace }}/knowledge-catalog-jvto-bootstrap
        run: |
          npm run sync:packages
          npm run sync:trust
          npm run sync:blog
          npm run sync:policy-bundle
          npm run sync:okf
          git diff --exit-code src/data/package-readiness src/data/trust-bundle src/data/blog src/data/policy-bundle src/data/okf \
            || { echo "::error::Synced bundles drifted from source. Run 'npm run sync:packages && npm run sync:trust && npm run sync:blog && npm run sync:policy-bundle && npm run sync:okf' and commit."; exit 1; }

      - name: Validate OKF consumption (blocking)
        # scripts/validate-okf-consumption.mjs: every AGENT_GUIDES route (src/lib/
        # content/agentGuides.ts) must map to at least one OKF module, and its
        # copy must not diverge from OKF on any canonical-facts rule — catches
        # hand-edits away from the mandatory/canonical wording OKF ships.
        run: npm run validate:okf

      - name: Typecheck (non-blocking)
        continue-on-error: true
        run: npx tsc --noEmit

  # Full `npm run build` against the dev DB on the develop server, over SSH.
  # Gated on `verify`. Runs a FIXED server-side script (scripts/build-pr.sh,
  # installed on the server from main) — not an arbitrary remote command.
  # Verification only: isolated per-PR build dir, dev DB, never touches production.
  build-develop:
    needs: verify
    runs-on: ubuntu-latest
    # PRs only (needs PR number + head SHA), same-repo only (forks lack SSH secrets).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout (for docs-only detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        # A true-documentation-only PR does not affect the build, so it must not
        # run the flaky VPS-SSH develop build (automation-governance hardening
        # 2026-08-04). "Documentation" is ONLY `docs/**` and root-level *.md
        # (README.md / CLAUDE.md). Served content Markdown is production output
        # and MUST build — content/pages/**/*.md renders via loadStaticPage and
        # src/data/blog/**/*.md via src/lib/blog.ts — so a blanket `.md` rule
        # would wrongly skip the only full build check. Any changed file that is
        # not documentation sets code=true. This exact predicate is asserted by
        # scripts/ci/docs-only-selftest.sh (run in the verify job above).
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "changed files:"; echo "$files"
          nondoc="$(printf '%s\n' "$files" | grep -vE '(^docs/|^[^/]+\.md$)' || true)"
          if [ -n "$nondoc" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "non-documentation files changed -> running develop build"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::True-documentation-only PR (docs/** or root-level *.md) — skipping the develop-server build."
          fi

      - name: Check develop-server secrets are configured
        id: cfg
        if: steps.changes.outputs.code == 'true'
        env:
          HOST: ${{ secrets.DEVELOP_SSH_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEVELOP_SSH_* secrets not set — develop build gate is pending setup (see issue #16). Skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR on develop server (dev DB, isolated)
        if: steps.changes.outputs.code == 'true' && steps.cfg.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEVELOP_SSH_HOST }}
          username: ${{ secrets.DEVELOP_SSH_USER }}
          key: ${{ secrets.DEVELOP_SSH_KEY }}
          command_timeout: 30m
          # Fixed, pre-installed trusted script. PR number + commit SHA are the
          # only inputs; the script re-validates them. Runs the build of the
          # exact PR head SHA against the dev DB in an isolated dir.
          script: |
            bash "$HOME/jvto-build-control/scripts/build-pr.sh" "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.head.sha }}"
