name: CI

# Pre-merge checks. Production deploy stays owned by deploy.yml (push -> main).
# The `verify` job runs lint/typecheck/drift on a GitHub runner (no build: SSG
# build needs Postgres). The `build-develop` job runs a real `npm run build` on
# the DEVELOP server (dev DB) over SSH — verification only, never production.
# `live` is included so promote PRs (live <- main) pass the same verify gate
# before production picks them up — see docs/CONTRIBUTING.md (branch model).
on:
  pull_request:
    branches: [main, live]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jvto-web
        uses: actions/checkout@v4

      # Producer repo, so the drift check can re-sync and compare. Reuses GH_PAT
      # (same secret used by update-volcanic-status.yml).
      - name: Checkout llm-wiki (producer)
        uses: actions/checkout@v4
        with:
          repository: sambuko82/llm-wiki
          ref: master
          path: llm-wiki
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate schema & routes (blocking)
        # Zero-dep static gates (scripts/validate.mjs): fails on duplicate
        # Organization/BreadcrumbList/FAQPage per route and registry/route drift.
        # Direct node invocations: `npm run validate` is now a chained gate
        # (schema && routes && content), so npm arg-append no longer selects a
        # subcommand.
        run: |
          node scripts/validate.mjs schema
          node scripts/validate.mjs routes

      - name: Validate content drift (blocking)
        # Canonical-facts gate (scripts/validate-content-drift.mjs): scans src/,
        # public/llms*.txt and docs/CANONICAL_FACTS.md for forbidden patterns —
        # stale founding year, blue-fire "guarantee" wording, stale review
        # counts, non-IDR prices, stale deposit/group terms, unverified press
        # names, and the retired jvto-config.json brand-config JSON pattern.
        # Lines carrying a `drift-ok: <reason>` marker are whitelisted (used by
        # docs/CANONICAL_FACTS.md to quote forbidden examples deliberately).
        run: npm run validate:content

      - name: Generate Prisma client
        # generate does not connect; the dummy URL only satisfies env("DATABASE_URL").
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
        run: npx prisma generate

      - name: Lint (blocking, baseline-gated)
        # Flat-config crash fixed 2026-07-05 (native eslint-config-next flat
        # exports; FlatCompat removed). Blocking via scripts/lint-gate.mjs:
        # any bucket in the committed per-file/per-rule baseline
        # (scripts/lint-baseline.json, 141 pre-existing errors) that grows =
        # fail — fixing legacy errors elsewhere cannot offset a new one.
        # Fixed legacy errors: `node scripts/lint-gate.mjs --update` + commit.
        run: npm run lint:gate

      - name: Sync bundles and check for drift
        env:
          LLM_WIKI_PATH: ${{ github.workspace }}/llm-wiki
          # sync-policy-bundle.mjs resolves its source via LLM_WIKI_ROOT (not
          # LLM_WIKI_PATH) per its own header comment — set both to the same
          # checked-out producer repo rather than editing the synced script.
          LLM_WIKI_ROOT: ${{ github.workspace }}/llm-wiki
        run: |
          npm run sync:packages
          npm run sync:trust
          npm run sync:blog
          npm run sync:policy-bundle
          git diff --exit-code src/data/package-readiness src/data/trust-bundle src/data/blog src/data/policy-bundle \
            || { echo "::error::Synced bundles drifted from llm-wiki output. Run 'npm run sync:packages && npm run sync:trust && npm run sync:blog && npm run sync:policy-bundle' and commit."; exit 1; }

      - name: Typecheck (non-blocking)
        continue-on-error: true
        run: npx tsc --noEmit

  # Full `npm run build` against the dev DB on the develop server, over SSH.
  # Gated on `verify`. Runs a FIXED server-side script (scripts/build-pr.sh,
  # installed on the server from main) — not an arbitrary remote command.
  # Verification only: isolated per-PR build dir, dev DB, never touches production.
  build-develop:
    needs: verify
    runs-on: ubuntu-latest
    # PRs only (needs PR number + head SHA), same-repo only (forks lack SSH secrets).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check develop-server secrets are configured
        id: cfg
        env:
          HOST: ${{ secrets.DEVELOP_SSH_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEVELOP_SSH_* secrets not set — develop build gate is pending setup (see issue #16). Skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR on develop server (dev DB, isolated)
        if: steps.cfg.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEVELOP_SSH_HOST }}
          username: ${{ secrets.DEVELOP_SSH_USER }}
          key: ${{ secrets.DEVELOP_SSH_KEY }}
          command_timeout: 30m
          # Fixed, pre-installed trusted script. PR number + commit SHA are the
          # only inputs; the script re-validates them. Runs the build of the
          # exact PR head SHA against the dev DB in an isolated dir.
          script: |
            bash "$HOME/jvto-build-control/scripts/build-pr.sh" "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.head.sha }}"
