name: Sync artifacts (llm-wiki + OKF)

# Consolidated artifact sync — consumes the compiled artifacts from BOTH producers
# (sambuko82/llm-wiki + sambuko82/knowledge-catalog-jvto-bootstrap) and opens ONE
# artifact-only PR per target branch, then auto-merges once safety gates pass.
#
# WHY ONE WORKFLOW (replaces the former per-producer sync-llm-wiki.yml + sync-okf.yml):
# ci.yml's `verify` drift gate re-syncs ALL FIVE bundles from llm-wiki@master +
# OKF@main and fails if ANY is stale. The old per-producer workflows each refreshed
# only their own slice, so when two producers changed together their sync PRs
# DEADLOCKED (each failed `verify` on the other's staleness) — and `policy-bundle`
# was synced by neither, so a policy-bundle-only change could never land. Syncing all
# five bundles from both producers in a single PR makes the drift gate satisfiable in
# one commit: deadlock is structurally impossible and every bundle is covered.
#
# repository_dispatch fires from the DEFAULT branch (main) for BOTH producers' push
# notifications; this one workflow drives both target branches via a matrix:
#   - main  -> help/develop subdomain (deploy.yml runs on push to main)
#   - live  -> production (its own deploy trigger; deploy.yml is NOT touched here)
on:
  repository_dispatch:
    types: [llm-wiki-master-updated, okf-main-updated]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      # Independent legs — a problem syncing one branch must not abort the other.
      fail-fast: false
      matrix:
        base: [main, live]
    # One sync per base at a time; a fixed per-base PR branch means re-runs update
    # the same PR instead of stacking new ones, and a dispatch that arrives mid-run
    # queues rather than racing.
    concurrency:
      group: sync-artifacts-${{ matrix.base }}
      cancel-in-progress: false
    steps:
      - name: Checkout jvto-web (${{ matrix.base }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.base }}
          token: ${{ secrets.GH_PAT }}

      # Producers are pinned to their default branches (master / main) — the SAME
      # refs ci.yml's drift gate re-syncs from, so a green sync PR here == a green
      # `verify` there. The dispatch is only the trigger signal, not the ref.
      - name: Checkout llm-wiki (producer) at master
        uses: actions/checkout@v4
        with:
          repository: sambuko82/llm-wiki
          ref: master
          path: llm-wiki
          token: ${{ secrets.GH_PAT }}

      - name: Checkout knowledge-catalog-jvto-bootstrap (producer) at main
        uses: actions/checkout@v4
        with:
          repository: sambuko82/knowledge-catalog-jvto-bootstrap
          ref: main
          path: knowledge-catalog-jvto-bootstrap
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync all five artifact bundles from both producers
        env:
          LLM_WIKI_PATH: ${{ github.workspace }}/llm-wiki
          # sync-policy-bundle.mjs resolves its source via LLM_WIKI_ROOT (not
          # LLM_WIKI_PATH) per its own header — set both to the same producer.
          LLM_WIKI_ROOT: ${{ github.workspace }}/llm-wiki
          OKF_PATH: ${{ github.workspace }}/knowledge-catalog-jvto-bootstrap
        run: |
          npm run sync:packages
          npm run sync:trust
          npm run sync:blog
          npm run sync:policy-bundle
          npm run sync:okf

      - name: Validate OKF consumption
        # Same gate as ci.yml's verify job — a route diverging from its OKF source
        # must block the sync PR too, not just a manually-triggered PR.
        run: npm run validate:okf

      - name: Detect artifact changes
        id: diff
        run: |
          if git diff --quiet -- src/data/package-readiness src/data/trust-bundle src/data/blog src/data/policy-bundle src/data/okf; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::[${{ matrix.base }}] No artifact changes — no sync needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "### Changed artifacts (${{ matrix.base }})"; echo '```'; git -c color.ui=never diff --stat -- src/data/package-readiness src/data/trust-bundle src/data/blog src/data/policy-bundle src/data/okf; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guard — only artifact dirs may change
        if: steps.diff.outputs.changed == 'true'
        run: |
          # Tracked modifications only — the producer checkouts live at ./llm-wiki
          # and ./knowledge-catalog-jvto-bootstrap (untracked) and must be ignored.
          bad="$(git diff --name-only -- . | grep -vE '^src/data/(package-readiness|trust-bundle|blog|policy-bundle|okf)/' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Unexpected non-artifact changes detected — aborting:"; echo "$bad"; exit 1
          fi

      - name: Resolve producer source SHAs
        if: steps.diff.outputs.changed == 'true'
        id: src
        run: |
          echo "llmwiki=$(git -C llm-wiki rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "okf=$(git -C knowledge-catalog-jvto-bootstrap rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create / update sync PR
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          add-paths: |
            src/data/package-readiness
            src/data/trust-bundle
            src/data/blog
            src/data/policy-bundle
            src/data/okf
          branch: automation/sync-artifacts-${{ matrix.base }}
          base: ${{ matrix.base }}
          delete-branch: false
          commit-message: "chore(sync): update llm-wiki + OKF artifacts"
          title: "chore(sync): update llm-wiki + OKF artifacts (${{ matrix.base }})"
          body: |
            Automated **all-bundle** artifact sync into `${{ matrix.base }}`.

            - **llm-wiki source commit:** `${{ steps.src.outputs.llmwiki }}`
            - **OKF source commit:** `${{ steps.src.outputs.okf }}`
            - **Changed dirs:** `src/data/{package-readiness,trust-bundle,blog,policy-bundle,okf}`
            - **Sync commands:** `sync:packages` + `sync:trust` + `sync:blog` + `sync:policy-bundle` + `sync:okf`
            - **Triggered by:** `${{ github.event_name }}`

            All five bundles are re-synced from both producers at once, so the CI
            `verify` drift gate is always satisfiable in a single PR (no
            per-producer deadlock; `policy-bundle` included). Artifact-only change;
            the target branch's own deploy trigger picks it up.

      # Auto-merge the artifact PR once safety gates pass. Only ever acts on the
      # automation/sync-artifacts-<base> -> <base> PR with artifact-only changes.
      # Uses GH_PAT so the merge's push triggers the target branch's deploy.
      - name: Auto-merge artifact PR
        if: steps.diff.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          EXPECTED_HEAD: automation/sync-artifacts-${{ matrix.base }}
          EXPECTED_BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          url=$(gh pr view "$PR" --json url -q .url)
          # Pin the exact head we validate; the final merge must match it, so a push
          # racing in between fails the merge instead of merging unvalidated content.
          head_sha=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          echo "::notice::Auto-merge candidate PR #$PR ($url) @ $head_sha — op=${{ steps.cpr.outputs.pull-request-operation }}"

          # --- Gate 1/2: head + base branch ---
          head=$(gh pr view "$PR" --json headRefName -q .headRefName)
          base=$(gh pr view "$PR" --json baseRefName -q .baseRefName)
          echo "head=$head  base=$base"
          [ "$head" = "$EXPECTED_HEAD" ] || { echo "::error::refusing — head '$head' != $EXPECTED_HEAD"; exit 1; }
          [ "$base" = "$EXPECTED_BASE" ] || { echo "::error::refusing — base '$base' != $EXPECTED_BASE"; exit 1; }

          # --- Gate 3: only artifact files changed (also enforces: no deploy.yml, no source) ---
          files=$(gh pr view "$PR" --json files -q '.files[].path')
          echo "Changed files:"; printf '  %s\n' $files
          bad=$(printf '%s\n' $files | grep -vE '^src/data/(package-readiness|trust-bundle|blog|policy-bundle|okf)/' || true)
          [ -z "$bad" ] || { echo "::error::refusing — non-artifact files present:"; printf '  %s\n' $bad; exit 1; }

          # --- Gate 4: wait for required check `verify` (build-develop is non-required: flaky VPS SSH, see #18) ---
          st=""
          for i in $(seq 1 40); do
            st=$(gh pr view "$PR" --json statusCheckRollup -q '.statusCheckRollup[] | select(.name=="verify") | "\(.status):\(.conclusion // "")"' | head -1 || true)
            echo "verify: ${st:-pending} (poll $i/40)"
            case "$st" in
              COMPLETED:SUCCESS) break;;
              COMPLETED:*) echo "::error::verify did not pass ($st) — not merging"; exit 1;;
            esac
            sleep 20
          done
          [ "$st" = "COMPLETED:SUCCESS" ] || { echo "::error::verify did not complete in time — not merging"; exit 1; }

          # --- Gate 5: mergeable ---
          m=$(gh pr view "$PR" --json mergeable -q .mergeable)
          echo "mergeable=$m"
          [ "$m" != "CONFLICTING" ] || { echo "::error::PR conflicting — not merging"; exit 1; }

          # --- Merge (squash) + delete the sync branch; abort if head moved since validation ---
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$head_sha"
          echo "::notice::Auto-merged PR #$PR @ $head_sha into $base (squash, branch deleted). Target deploy will run."
