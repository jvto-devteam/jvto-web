name: Sync llm-wiki artifacts

# Consume compiled artifacts from llm-wiki and open an artifact-only PR into each
# target branch, then auto-merge it once safety gates pass.
#
# repository_dispatch only ever fires workflows from the DEFAULT branch (main),
# so this single workflow drives the sync for BOTH branches via a matrix:
#   - main  → help/develop subdomain (deploy.yml runs on push to main)
#   - live  → production (its own deploy trigger; deploy.yml is NOT touched here)
on:
  repository_dispatch:
    types: [llm-wiki-master-updated]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      # Independent legs — a problem syncing one branch must not abort the other.
      fail-fast: false
      matrix:
        base: [main, live]
    # One sync per base at a time; a fixed per-base PR branch means re-runs update
    # the same PR instead of stacking new ones.
    concurrency:
      group: sync-llm-wiki-${{ matrix.base }}
      cancel-in-progress: false
    steps:
      - name: Resolve llm-wiki ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            sha="${{ github.event.client_payload.sha }}"
            if [ -z "$sha" ]; then echo "::error::repository_dispatch missing client_payload.sha"; exit 1; fi
            echo "ref=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"   # manual fallback
          fi

      - name: Checkout jvto-web (${{ matrix.base }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.base }}
          token: ${{ secrets.GH_PAT }}

      - name: Checkout llm-wiki (producer) at exact ref
        uses: actions/checkout@v4
        with:
          repository: sambuko82/llm-wiki
          ref: ${{ steps.ref.outputs.ref }}
          path: llm-wiki
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync artifacts from llm-wiki
        env:
          LLM_WIKI_PATH: ${{ github.workspace }}/llm-wiki
        run: |
          npm run sync:packages
          npm run sync:trust

      - name: Detect artifact changes
        id: diff
        run: |
          if git diff --quiet -- src/data/package-readiness src/data/trust-bundle; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::[${{ matrix.base }}] No artifact changes — no sync needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "### Changed artifacts (${{ matrix.base }})"; echo '```'; git -c color.ui=never diff --stat -- src/data/package-readiness src/data/trust-bundle; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guard — only artifact dirs may change
        if: steps.diff.outputs.changed == 'true'
        run: |
          # Tracked modifications only — the producer checkout lives at ./llm-wiki
          # (untracked) and must be ignored; sync only overwrites committed artifacts.
          bad="$(git diff --name-only -- . | grep -vE '^src/data/(package-readiness|trust-bundle)/' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Unexpected non-artifact changes detected — aborting:"; echo "$bad"; exit 1
          fi

      - name: Resolve llm-wiki source SHA
        if: steps.diff.outputs.changed == 'true'
        id: src
        run: echo "sha=$(git -C llm-wiki rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create / update sync PR
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          add-paths: |
            src/data/package-readiness
            src/data/trust-bundle
          branch: automation/sync-llm-wiki-${{ matrix.base }}
          base: ${{ matrix.base }}
          delete-branch: false
          commit-message: "chore(sync): update llm-wiki artifacts"
          title: "chore(sync): update llm-wiki artifacts (${{ matrix.base }})"
          body: |
            Automated artifact sync from **llm-wiki** into `${{ matrix.base }}`.

            - **llm-wiki source commit:** `${{ steps.src.outputs.sha }}`
            - **Changed dirs:** `src/data/package-readiness`, `src/data/trust-bundle`
            - **Sync commands:** `npm run sync:packages`, `npm run sync:trust`
            - **Triggered by:** `${{ github.event_name }}`

            Artifact-only change. The target branch's own deploy trigger picks it up
            (main → `deploy.yml` → help subdomain; live → production deploy).
            No production touch from this workflow; no deploy.yml change.

      # Auto-merge the artifact PR once safety gates pass. Only ever acts on the
      # automation/sync-llm-wiki-<base> → <base> PR with artifact-only changes.
      # Uses GH_PAT so the merge's push triggers the target branch's deploy.
      - name: Auto-merge artifact PR
        if: steps.diff.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          EXPECTED_HEAD: automation/sync-llm-wiki-${{ matrix.base }}
          EXPECTED_BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          url=$(gh pr view "$PR" --json url -q .url)
          # Pin the exact head we validate; the final merge must match it, so a push
          # racing in between fails the merge instead of merging unvalidated content.
          head_sha=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          echo "::notice::Auto-merge candidate PR #$PR ($url) @ $head_sha — op=${{ steps.cpr.outputs.pull-request-operation }}"

          # --- Gate 1/2: head + base branch ---
          head=$(gh pr view "$PR" --json headRefName -q .headRefName)
          base=$(gh pr view "$PR" --json baseRefName -q .baseRefName)
          echo "head=$head  base=$base"
          [ "$head" = "$EXPECTED_HEAD" ] || { echo "::error::refusing — head '$head' != $EXPECTED_HEAD"; exit 1; }
          [ "$base" = "$EXPECTED_BASE" ] || { echo "::error::refusing — base '$base' != $EXPECTED_BASE"; exit 1; }

          # --- Gate 3: only artifact files changed (also enforces: no deploy.yml, no source) ---
          files=$(gh pr view "$PR" --json files -q '.files[].path')
          echo "Changed files:"; printf '  %s\n' $files
          bad=$(printf '%s\n' $files | grep -vE '^src/data/(package-readiness|trust-bundle)/' || true)
          [ -z "$bad" ] || { echo "::error::refusing — non-artifact files present:"; printf '  %s\n' $bad; exit 1; }

          # --- Gate 4: wait for required check `verify` (build-develop is non-required: flaky VPS SSH, see #18) ---
          st=""
          for i in $(seq 1 40); do
            st=$(gh pr view "$PR" --json statusCheckRollup -q '.statusCheckRollup[] | select(.name=="verify") | "\(.status):\(.conclusion // "")"' | head -1 || true)
            echo "verify: ${st:-pending} (poll $i/40)"
            case "$st" in
              COMPLETED:SUCCESS) break;;
              COMPLETED:*) echo "::error::verify did not pass ($st) — not merging"; exit 1;;
            esac
            sleep 20
          done
          [ "$st" = "COMPLETED:SUCCESS" ] || { echo "::error::verify did not complete in time — not merging"; exit 1; }

          # --- Gate 5: mergeable ---
          m=$(gh pr view "$PR" --json mergeable -q .mergeable)
          echo "mergeable=$m"
          [ "$m" != "CONFLICTING" ] || { echo "::error::PR conflicting — not merging"; exit 1; }

          # --- Merge (squash) + delete the sync branch; abort if head moved since validation ---
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$head_sha"
          echo "::notice::Auto-merged PR #$PR @ $head_sha into $base (squash, branch deleted). Target deploy will run."
